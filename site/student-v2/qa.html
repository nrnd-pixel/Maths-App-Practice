<!doctype html><html lang="en"><meta charset="utf-8"><title>Responsive UI QA</title><style>body{margin:0;background:#cbd5e1;font:14px system-ui}header{padding:12px;display:flex;gap:10px;align-items:center}button,select{padding:10px;font:inherit}iframe{display:block;background:white;border:0;margin:0 auto;width:390px;height:844px}</style><header><strong>Responsive UI test</strong><label>Viewport <select id="size"><option value="390,844">390 × 844</option><option value="360,800">360 × 800</option><option value="430,932">430 × 932</option><option value="768,1024">768 × 1024</option><option value="1280,900">1280 × 900</option><option value="390,430">390 × 430 keyboard space</option></select></label><label>Text size <select id="zoom"><option value="16px">100%</option><option value="32px">200%</option></select></label></header><iframe id="app" title="Student prototype" src="/student-v2/"></iframe><script>document.querySelector('#size').onchange=e=>{const [w,h]=e.target.value.split(',');const f=document.querySelector('iframe');f.style.width=w+'px';f.style.height=h+'px';};document.querySelector('#zoom').onchange=e=>document.querySelector('iframe').contentDocument.documentElement.style.fontSize=e.target.value;</script></html>
