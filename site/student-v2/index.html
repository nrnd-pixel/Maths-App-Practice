function navigate(r){if(location.hash==='#'+r)render();else location.hash=r;}
function modal(title,body,actions=''){const d=$('#dialog');$('#dialog-body').innerHTML=`<h2 id="dialog-title">${title}</h2>${body}${actions}`;d.showModal();}
let pendingStart=null;
function begin(title,kind,questions,offset=0){if(model.active){pendingStart={title,kind,questions,offset};modal('You have practice saved','<p>Would you like to continue it, or start this new sample? Starting new replaces only your unfinished demo session.</p>',`${btn('Continue saved practice','resume-saved','full')}${btn('Start new sample','replace-saved','secondary full spaced')}`);return;}start({title,kind,questions,offset});}
function start(a){model.active={...a,index:0,answers:[],draft:[],checked:false,hint:false};save();navigate('quiz');}
function parseAnswer(s){const t=String(s).trim().replaceAll(' ','').replaceAll(',','');if(/^[-+]?\d+(?:\.\d+)?$/.test(t))return Number(t);if(/^\d+\/\d+$/.test(t)){const [n,d]=t.split('/').map(Number);return d?n/d:NaN;}return NaN;}
function check(){const a=model.active,q=a.questions[a.index];if(a.checked)return;const form=$('#answer-form');if(!form.reportValidity())return;const response=q.choices?[form.elements.answer.value]:q.answer.map((_,i)=>form.elements['answer-'+i].value.trim());if(response.some(v=>!v)){toast('Add your answer first.');return;}const correct=response.every((v,i)=>Number.isFinite(parseAnswer(v))&&Math.abs(parseAnswer(v)-parseAnswer(q.answer[i]))<0.000001);a.draft=response;a.answers.push({text:q.text,topic:q.topic,response,correct,explain:q.explain,hint:a.hint});a.checked=true;save();render(false);$('#answer-feedback').scrollIntoView({block:'nearest'});$('#main [data-action="next"]').focus({preventScroll:true});}
function finish(){const a=model.active;const correct=a.answers.filter(x=>x.correct).length;const xp=a.answers.length*10;model.completed+=a.answers.length;model.correct+=correct;model.xp+=xp;model.sessions++;a.answers.forEach(x=>{if(!['Fractions','Decimals','Measurement',...model.extraTopics].includes(x.topic))model.extraTopics.push(x.topic);const score=model.topicScores[x.topic]||(model.topicScores[x.topic]=[0,0]);score[0]+=x.correct?1:0;score[1]++;});if(a.kind==='Assigned Practice')model.assignmentDone=true;model.lastResult={title:a.title,kind:a.kind,answers:a.answers,correct,xp};model.active=null;save();navigate('result');}
const mixed=()=>[bank.Fractions[0],bank.Decimals[0],bank.Measurement[0],bank.Money[0],bank.Geometry[0]];
function action(a){switch(a){case'continue':navigate('quiz');break;case'mixed':begin('A little bit of everything','Mixed Practice',mixed());break;case'assignment':if(model.active?.kind==='Assigned Practice'){navigate('quiz');break;}begin('Fractions and Decimals','Assigned Practice',[...bank.Fractions,...bank.Decimals,bank.Fractions[0],bank.Decimals[0]],4);break;case'recommended':begin('Problem Solver','Recommended Practice',bank['Problem Solving']);break;case'pause':save();navigate('practice');toast(memoryOnly?'Paused for this visit. Browser storage is unavailable.':'Demo practice saved on this device.');break;case'hint':model.active.hint=true;save();render(false);break;case'next':if(!model.active?.checked)return;if(model.active.index===model.active.questions.length-1){finish();break;}model.active.index++;model.active.checked=false;model.active.hint=false;model.active.draft=[];save();render();break;case'resume-saved':$('#dialog').close();pendingStart=null;navigate('quiz');break;case'replace-saved':$('#dialog').close();if(pendingStart){start(pendingStart);pendingStart=null;}break;case'reset':modal('Reset this demo?','<p>This clears only the fictional progress and sample answers in the new UI. Your real app is not affected.</p>','<button class="btn full" data-action="confirm-reset">Reset demo progress</button>');break;case'confirm-reset':model=initial();save();$('#dialog').close();navigate('home');toast('Demo reset. Ready to explore again.');break;default:if(a.startsWith('badge-')){const id=a.slice(6);const details={fraction:['Fraction Fan','You kept exploring fractions. This original badge celebrates your effort.'],first:['First Steps','You completed your first practice. Every journey begins with one step.'],streak:['Five-Day Explorer','You made time for learning. A rest day will never take away what you learned.'],solver:['Problem Solver',model.sessions>=8?'You completed eight demo sessions!':`${8-model.sessions} more demo sessions to go. Try your next small challenge.`],weekly:['Weekly Wonder',model.sessions>=10?'You completed the weekly demo mission!':`${10-model.sessions} more demo sessions to go. A little at a time is enough.`],topics:['Topic Explorer',3+model.extraTopics.length>=5?'You explored five topics in the demo!':'Explore two new topics to grow your collection.']};const [t,d]=details[id]||details.fraction;modal(t,`<div class="row spaced">${badge()}<p>${d}</p></div>`,go('Explore practice','practice','full'));}}}
document.addEventListener('click',e=>{if(e.target.closest('.skip')){e.preventDefault();main.focus();return;}const el=e.target.closest('button[data-go],button[data-action],button[data-topic],button[data-paper]');if(!el)return;if(el.dataset.go){if($('#dialog').open)$('#dialog').close();navigate(el.dataset.go);}else if(el.dataset.action)action(el.dataset.action);else if(el.dataset.topic)begin(el.dataset.topic,'Topic Practice',bank[el.dataset.topic]);else if(el.dataset.paper){const p=el.dataset.paper;begin(p+' · Sample','Past Paper Practice',p.endsWith('2')?[bank['Problem Solving'][1],bank.Measurement[1],bank.Fractions[1]]:mixed());}});
document.addEventListener('submit',e=>{if(e.target.id==='answer-form'){e.preventDefault();check();}});
document.addEventListener('input',e=>{if(e.target.closest('#answer-form')&&model.active&&!model.active.checked){const a=model.active,q=a.questions[a.index],form=$('#answer-form');a.draft=q.choices?[form.elements.answer.value]:q.answer.map((_,i)=>form.elements['answer-'+i].value);save();}});
document.addEventListener('change',e=>{if(e.target.dataset.setting){const key=e.target.dataset.setting;model.settings[key]=e.target.checked;save();document.documentElement.classList.toggle('large-text',model.settings.large);document.body.classList.toggle('quiet',model.settings.quiet);}});
$('#close-dialog').addEventListener('click',()=>{$('#dialog').close();pendingStart=null;});
window.addEventListener('hashchange',()=>render());
window.addEventListener('pagehide',save);
render(false);
})();
</script><!-- END_SCRIPT -->
</body></html>
