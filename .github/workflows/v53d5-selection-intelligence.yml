name: V5.3D5 Selection Intelligence

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  regression:
    name: V5.3D5 selection intelligence
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify V5.3D5 Practice selection intelligence
        run: node site/tests/verify-v5.3d5-practice-selection-intelligence.cjs
