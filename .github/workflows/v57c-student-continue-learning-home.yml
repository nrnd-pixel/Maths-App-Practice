name: V5.7C Student Continue Learning Home

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - development/v57c-student-continue-learning-home

permissions:
  contents: read

jobs:
  verify:
    name: Verify V5.7C Student Continue Learning Home
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run V5.6.1 Practice-first regression
        run: node site/tests/verify-v5.6.1-practice-first-student-experience.cjs
      - name: Run V5.7A cross-device resume regression
        run: node site/tests/verify-v5.7a-cross-device-past-paper-resume.cjs
      - name: Run V5.7B teacher assignment-management regression
        run: node site/tests/verify-v5.7b-teacher-assignment-management.cjs
      - name: Run V5.7C Continue Learning Home regression
        run: node site/tests/verify-v5.7c-student-continue-learning-home.cjs
