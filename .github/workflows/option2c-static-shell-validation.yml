name: Option 2C static V40 shell validation

on:
  push:
    branches:
      - tech-debt-phase-4-option2c-static-nav-learn-shell
    paths:
      - '.github/option2c_static_shell_patch.py'
      - '.github/workflows/option2c-static-shell-validation.yml'

permissions:
  contents: write

concurrency:
  group: option2c-static-shell-validation
  cancel-in-progress: true

jobs:
  validate:
    name: Full Option 2C checkpoint validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure validation commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Materialize static shell, corrected hard gates and successor seals
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          helper_source = Path('.github/option2c_static_shell_patch.py').read_text()
          old_parser = "changed = {line[3:] for line in git('status', '--porcelain').splitlines() if line.strip()}"
          new_parser = "changed = set(filter(None, git('diff', '--name-only').splitlines()))"
          helper_source = replace_once(helper_source, old_parser, new_parser, 'temporary scope-parser patch')
          Path('/tmp/option2c_static_shell_patch.py').write_text(helper_source)

          spec_path = Path('e2e/tests/v40-static-v40-shell-option2c.spec.cjs')
          spec = spec_path.read_text()

          spec = replace_once(
              spec,
              "      platformValidate: null,\n",
              "      platformValidate: null,\n      v52c2Validate: null,\n      validateOrder: [],\n",
              'capture V52C2 stage',
          )
          spec = replace_once(
              spec,
              "      capture.baseValidate = window.validateStudentAccess;\n",
              "      capture.baseValidate = window.validateStudentAccess;\n      capture.validateOrder.push('base');\n",
              'record base stage',
          )
          old_platform_capture = """            if (src.includes('v40-platform-polish.js')) {
              node.addEventListener('load', () => {
                capture.platformValidate = window.validateStudentAccess;
              }, { once: true });
            }
"""
          new_platform_capture = old_platform_capture + """            if (src.includes('v52c2-topical-result-ux.js')) {
              node.addEventListener('load', () => {
                capture.v52c2Validate = window.validateStudentAccess;
                capture.validateOrder.push('v52c2');
              }, { once: true });
            }
"""
          spec = replace_once(spec, old_platform_capture, new_platform_capture, 'capture V52C2 load stage')
          spec = replace_once(
              spec,
              "                capture.sessionValidate = window.validateStudentAccess;\n",
              "                capture.sessionValidate = window.validateStudentAccess;\n                capture.validateOrder.push('session');\n",
              'record session stage',
          )
          spec = replace_once(
              spec,
              "                capture.platformValidate = window.validateStudentAccess;\n",
              "                capture.platformValidate = window.validateStudentAccess;\n                capture.validateOrder.push('platform-polish');\n",
              'record platform stage',
          )

          old_gate6 = """  test('gate 6 — non-Home transitions use the existing Home controls before opening the next student section', async ({ page }) => {
    await installSupabaseMock(page);
    await openApp(page);
    await signInAndWait(page);

    await page.locator('#start [data-v40-nav=\"assignments\"]').click();
    await expect(page.locator('#student-assignments')).toHaveClass(/active/);

    await page.locator('#student-assignments [data-v40-nav=\"progress\"]').click();
    await expect(page.locator('#student-dashboard')).toHaveClass(/active/);

    await page.locator('#student-dashboard [data-v40-nav=\"learn\"]').click();
    await expect(page.locator('#start')).toHaveClass(/active/);
    await expect(page.locator('#start')).toHaveAttribute('data-v40-start-view', 'learn');
    await expect(page.locator('#start .v40c-learn-setup')).toBeVisible();

    await page.locator('#start [data-v40-nav=\"home\"]').click();
    await expect(page.locator('#start')).toHaveAttribute('data-v40-start-view', 'home');
  });
"""
          new_gate6 = """  test('gate 6 — non-Home transitions use the existing back-home and delegated source-button path', async ({ page }) => {
    await installSupabaseMock(page);
    await openApp(page);
    await signInAndWait(page);

    await page.evaluate(() => {
      window.__option2cDelegation = {
        assignmentsBackHome: 0,
        progressSource: 0,
        dashboardBackHome: 0,
      };
      document.querySelector('#student-assignments .back-home')?.addEventListener('click', () => {
        window.__option2cDelegation.assignmentsBackHome += 1;
      });
      document.getElementById('my-progress-btn')?.addEventListener('click', () => {
        window.__option2cDelegation.progressSource += 1;
      });
      document.querySelector('#student-dashboard .back-home')?.addEventListener('click', () => {
        window.__option2cDelegation.dashboardBackHome += 1;
      });
    });

    await page.locator('#start [data-v40-nav=\"assignments\"]').click();
    await expect(page.locator('#student-assignments')).toHaveClass(/active/);

    await page.locator('#student-assignments [data-v40-nav=\"progress\"]').click();
    await expect(page.locator('#student-dashboard')).toHaveClass(/active/);
    expect(await page.evaluate(() => window.__option2cDelegation)).toMatchObject({
      assignmentsBackHome: 1,
      progressSource: 1,
    });

    await page.locator('#student-dashboard [data-v40-nav=\"learn\"]').click();
    await expect(page.locator('#start')).toHaveClass(/active/);
    await expect(page.locator('#start')).toHaveAttribute('data-v40-start-view', 'home');
    await expect(page.locator('#start [data-v40-nav=\"home\"]')).toHaveAttribute('aria-current', 'page');
    await expect(page.locator('#start .v40c-learn-setup')).toBeHidden();
    await expect(page.locator('#start .v39-home-hub')).toBeVisible();
    expect(await page.evaluate(() => window.__option2cDelegation.dashboardBackHome)).toBe(1);
  });
"""
          spec = replace_once(spec, old_gate6, new_gate6, 'Gate 6 delegation contract')

          spec = replace_once(
              spec,
              "      window.__option2cCapture?.platformValidate\n",
              "      window.__option2cCapture?.platformValidate &&\n      window.__option2cCapture?.v52c2Validate\n",
              'Gate 10 wait for V52C2 stage',
          )
          old_chain = """    const chain = await page.evaluate(() => {
      const capture = window.__option2cCapture;
      return {
        baseFunction: typeof capture.baseValidate === 'function',
        sessionFunction: typeof capture.sessionValidate === 'function',
        platformFunction: typeof capture.platformValidate === 'function',
        baseToSessionWrapped: capture.baseValidate !== capture.sessionValidate,
        sessionToPlatformWrapped: capture.sessionValidate !== capture.platformValidate,
        platformIsFinal: capture.platformValidate === window.validateStudentAccess,
      };
    });
    expect(chain).toEqual({
      baseFunction: true,
      sessionFunction: true,
      platformFunction: true,
      baseToSessionWrapped: true,
      sessionToPlatformWrapped: true,
      platformIsFinal: true,
    });
"""
          new_chain = """    const chain = await page.evaluate(() => {
      const capture = window.__option2cCapture;
      const knownStages = [
        capture.baseValidate,
        capture.sessionValidate,
        capture.platformValidate,
        capture.v52c2Validate,
      ];
      return {
        knownStagesAreFunctions: knownStages.every(fn => typeof fn === 'function'),
        knownStagesAreDistinct: new Set(knownStages).size === 4,
        baseToSessionWrapped: capture.baseValidate !== capture.sessionValidate,
        sessionToPlatformWrapped: capture.sessionValidate !== capture.platformValidate,
        platformToV52C2Wrapped: capture.platformValidate !== capture.v52c2Validate,
        knownLoadOrder: capture.validateOrder.slice(0, 4),
        currentFinalIsFunction: typeof window.validateStudentAccess === 'function',
      };
    });
    expect(chain).toEqual({
      knownStagesAreFunctions: true,
      knownStagesAreDistinct: true,
      baseToSessionWrapped: true,
      sessionToPlatformWrapped: true,
      platformToV52C2Wrapped: true,
      knownLoadOrder: ['base', 'session', 'platform-polish', 'v52c2'],
      currentFinalIsFunction: true,
    });

    const sessionSource = fs.readFileSync(path.join(REPO_ROOT, 'site/v40-student-session.js'), 'utf8');
    const platformSource = fs.readFileSync(path.join(REPO_ROOT, 'site/v40-platform-polish.js'), 'utf8');
    const v52c2Source = fs.readFileSync(path.join(REPO_ROOT, 'site/v52c2-topical-result-ux.js'), 'utf8');
    expect(sessionSource).toContain('const validateStudentAccessV40Base = validateStudentAccess;');
    expect(sessionSource).toContain('return validateStudentAccessV40Base(requestedPurpose);');
    expect(platformSource).toContain('const validateBase = validateStudentAccess;');
    expect(platformSource).toContain('const access = await validateBase(purpose);');
    expect(v52c2Source).toContain('const base=validateStudentAccess;');
    expect(v52c2Source).toContain('const access=await base(purpose);');
"""
          spec = replace_once(spec, old_chain, new_chain, 'Gate 10 known wrapper chain')
          spec_path.write_text(spec)
          PY
          python /tmp/option2c_static_shell_patch.py

      - name: Syntax and exact materialization scope audit
        shell: bash
        run: |
          set -euo pipefail
          node --check site/v40-student-nav.js
          node --check site/v40-learn-setup.js
          node --check e2e/tests/v40-static-v40-shell-option2c.spec.cjs
          python -m py_compile .github/option2c_static_shell_patch.py
          test -z "$(git status --porcelain -- supabase)"
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            e2e/tests/v40-static-authenticated-home-option2b.spec.cjs \
            e2e/tests/v40-static-student-signin-shell-option2a.spec.cjs \
            e2e/tests/v40-static-v40-shell-option2c.spec.cjs \
            site/index.html | sort)"
          test "$actual" = "$expected"

      - name: Create local candidate commit for HEAD-based guards
        shell: bash
        run: |
          set -euo pipefail
          git add \
            site/index.html \
            e2e/tests/v40-static-student-signin-shell-option2a.spec.cjs \
            e2e/tests/v40-static-authenticated-home-option2b.spec.cjs \
            e2e/tests/v40-static-v40-shell-option2c.spec.cjs
          git commit -m 'Phase 4 Option 2C: static V40 nav and Learn shell candidate'
          echo "CANDIDATE_HEAD=$(git rev-parse HEAD)"
          echo "CANDIDATE_TREE=$(git rev-parse HEAD^{tree})"
          echo 'Candidate diff from approved main:'
          git diff --name-status cacf5d0a2e1b921275dbde9a1a115576d1046b64..HEAD

      - name: Run maintained verifier suite
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t verifiers < <(
            sed -n '/verifiers=(/,/)/p' .github/workflows/ci.yml |
              sed -n 's/^[[:space:]]*"\(site\/tests\/verify[^" ]*\.cjs\)".*/\1/p'
          )
          echo "MAINTAINED_VERIFIER_COUNT=${#verifiers[@]}"
          test "${#verifiers[@]}" -gt 0
          failures=0
          for verifier in "${verifiers[@]}"; do
            echo "==> ${verifier}"
            if ! node "${verifier}"; then
              echo "::error::${verifier} failed"
              failures=$((failures + 1))
            fi
          done
          if [ "$failures" -ne 0 ]; then
            echo "::error::${failures} maintained verifier(s) failed"
            exit 1
          fi
          echo "MAINTAINED_VERIFIERS_PASSED=${#verifiers[@]}"

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Option 2C 10 hard gates
        working-directory: e2e
        run: npx playwright test tests/v40-static-v40-shell-option2c.spec.cjs --reporter=line

      - name: Run Option 2A 12 hard gates
        working-directory: e2e
        run: npx playwright test tests/v40-static-student-signin-shell-option2a.spec.cjs --reporter=line

      - name: Run Option 2B 12 hard gates
        working-directory: e2e
        run: npx playwright test tests/v40-static-authenticated-home-option2b.spec.cjs --reporter=line

      - name: Run Phase 0 core browser safety net
        working-directory: e2e
        run: npx playwright test tests/core.spec.cjs --reporter=line

      - name: Run V52C legacy topical hard gates
        working-directory: e2e
        run: npx playwright test tests/v52c-legacy-student-route-phase4-checkpoint1.spec.cjs --reporter=line

      - name: Run V54 resource-bank hard gates
        working-directory: e2e
        run: npx playwright test tests/v54-resource-bank-phase4-checkpoint1.spec.cjs --reporter=line

      - name: Run V50 operations/reporting hard gates
        working-directory: e2e
        run: npx playwright test tests/v50-operations-reporting-phase4-checkpoint1.spec.cjs --reporter=line

      - name: Run V51 question-bank management hard gates
        working-directory: e2e
        run: npx playwright test tests/v51-question-bank-management-phase4-checkpoint1.spec.cjs --reporter=line

      - name: Run V52B1 observer-gate adversarial hard gates
        working-directory: e2e
        run: npx playwright test tests/v52b1-observer-gate-phase4-adversarial.spec.cjs --reporter=line

      - name: Run full Playwright suite
        working-directory: e2e
        run: npm test

      - name: Verify candidate bytes did not drift during validation
        shell: bash
        run: |
          set -euo pipefail
          echo 'Post-validation working tree status:'
          git status --short
          git diff --exit-code -- site e2e/tests
          git diff --cached --exit-code
          echo "VALIDATED_HEAD=$(git rev-parse HEAD)"
          echo "VALIDATED_TREE=$(git rev-parse HEAD^{tree})"
          echo "VALIDATED_INDEX=$(git rev-parse HEAD:site/index.html)"
          echo "VALIDATED_NAV=$(git rev-parse HEAD:site/v40-student-nav.js)"
          echo "VALIDATED_LEARN=$(git rev-parse HEAD:site/v40-learn-setup.js)"
          echo "VALIDATED_SUPABASE=$(git rev-parse HEAD:supabase)"

      - name: Push fully validated candidate
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:tech-debt-phase-4-option2c-static-nav-learn-shell
