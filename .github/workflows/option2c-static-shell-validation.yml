name: Option 2C static V40 shell validation

on:
  push:
    branches:
      - tech-debt-phase-4-option2c-static-nav-learn-shell
    paths:
      - '.github/option2c_static_shell_patch.py'
      - '.github/workflows/option2c-static-shell-validation.yml'

permissions:
  contents: write

concurrency:
  group: option2c-static-shell-validation
  cancel-in-progress: true

jobs:
  validate:
    name: Full Option 2C checkpoint validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure validation commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Materialize static shell and successor seals
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/option2c_static_shell_patch.py').read_text()
          old = "changed = {line[3:] for line in git('status', '--porcelain').splitlines() if line.strip()}"
          new = "changed = set(filter(None, git('diff', '--name-only').splitlines()))"
          if source.count(old) != 1:
              raise SystemExit('temporary scope-parser patch target was not exact')
          Path('/tmp/option2c_static_shell_patch.py').write_text(source.replace(old, new, 1))
          PY
          python /tmp/option2c_static_shell_patch.py

      - name: Syntax and exact materialization scope audit
        shell: bash
        run: |
          set -euo pipefail
          node --check site/v40-student-nav.js
          node --check site/v40-learn-setup.js
          node --check e2e/tests/v40-static-v40-shell-option2c.spec.cjs
          python -m py_compile .github/option2c_static_shell_patch.py
          test -z "$(git status --porcelain -- supabase)"
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            e2e/tests/v40-static-authenticated-home-option2b.spec.cjs \
            e2e/tests/v40-static-student-signin-shell-option2a.spec.cjs \
            e2e/tests/v40-static-v40-shell-option2c.spec.cjs \
            site/index.html | sort)"
          test "$actual" = "$expected"

      - name: Create local candidate commit for HEAD-based guards
        shell: bash
        run: |
          set -euo pipefail
          git add \
            site/index.html \
            e2e/tests/v40-static-student-signin-shell-option2a.spec.cjs \
            e2e/tests/v40-static-authenticated-home-option2b.spec.cjs \
            e2e/tests/v40-static-v40-shell-option2c.spec.cjs
          git commit -m 'Phase 4 Option 2C: static V40 nav and Learn shell candidate'
          echo "CANDIDATE_HEAD=$(git rev-parse HEAD)"
          echo "CANDIDATE_TREE=$(git rev-parse HEAD^{tree})"
          echo 'Candidate diff from approved main:'
          git diff --name-status cacf5d0a2e1b921275dbde9a1a115576d1046b64..HEAD

      - name: Run maintained verifier suite
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t verifiers < <(
            sed -n '/verifiers=(/,/)/p' .github/workflows/ci.yml |
              sed -n 's/^[[:space:]]*"\(site\/tests\/verify[^" ]*\.cjs\)".*/\1/p'
          )
          echo "MAINTAINED_VERIFIER_COUNT=${#verifiers[@]}"
          test "${#verifiers[@]}" -gt 0
          failures=0
          for verifier in "${verifiers[@]}"; do
            echo "==> ${verifier}"
            if ! node "${verifier}"; then
              echo "::error::${verifier} failed"
              failures=$((failures + 1))
            fi
          done
          if [ "$failures" -ne 0 ]; then
            echo "::error::${failures} maintained verifier(s) failed"
            exit 1
          fi
          echo "MAINTAINED_VERIFIERS_PASSED=${#verifiers[@]}"

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Option 2C 10 hard gates
        working-directory: e2e
        run: npx playwright test tests/v40-static-v40-shell-option2c.spec.cjs --reporter=line

      - name: Run Option 2A 12 hard gates
        working-directory: e2e
        run: npx playwright test tests/v40-static-student-signin-shell-option2a.spec.cjs --reporter=line

      - name: Run Option 2B 12 hard gates
        working-directory: e2e
        run: npx playwright test tests/v40-static-authenticated-home-option2b.spec.cjs --reporter=line

      - name: Run Phase 0 core browser safety net
        working-directory: e2e
        run: npx playwright test tests/core.spec.cjs --reporter=line

      - name: Run V52C legacy topical hard gates
        working-directory: e2e
        run: npx playwright test tests/v52c-legacy-student-route-phase4-checkpoint1.spec.cjs --reporter=line

      - name: Run V54 resource-bank hard gates
        working-directory: e2e
        run: npx playwright test tests/v54-resource-bank-phase4-checkpoint1.spec.cjs --reporter=line

      - name: Run V50 operations/reporting hard gates
        working-directory: e2e
        run: npx playwright test tests/v50-operations-reporting-phase4-checkpoint1.spec.cjs --reporter=line

      - name: Run V51 question-bank management hard gates
        working-directory: e2e
        run: npx playwright test tests/v51-question-bank-management-phase4-checkpoint1.spec.cjs --reporter=line

      - name: Run V52B1 observer-gate adversarial hard gates
        working-directory: e2e
        run: npx playwright test tests/v52b1-observer-gate-phase4-adversarial.spec.cjs --reporter=line

      - name: Run full Playwright suite
        working-directory: e2e
        run: npm test

      - name: Verify candidate bytes did not drift during validation
        shell: bash
        run: |
          set -euo pipefail
          echo 'Post-validation working tree status:'
          git status --short
          git diff --exit-code -- site e2e/tests
          git diff --cached --exit-code
          echo "VALIDATED_HEAD=$(git rev-parse HEAD)"
          echo "VALIDATED_TREE=$(git rev-parse HEAD^{tree})"
          echo "VALIDATED_INDEX=$(git rev-parse HEAD:site/index.html)"
          echo "VALIDATED_NAV=$(git rev-parse HEAD:site/v40-student-nav.js)"
          echo "VALIDATED_LEARN=$(git rev-parse HEAD:site/v40-learn-setup.js)"
          echo "VALIDATED_SUPABASE=$(git rev-parse HEAD:supabase)"

      - name: Push fully validated candidate
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:tech-debt-phase-4-option2c-static-nav-learn-shell
