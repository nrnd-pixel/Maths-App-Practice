name: V5.8D Content Workflow Consolidation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  regression:
    name: V5.8D content workflow regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: V5.4 content checkpoint regression
        run: node site/tests/verify-v5.4-stable-release-checkpoint.cjs
      - name: Teacher Workspace regression
        run: node site/tests/verify-v5.8b-teacher-workspace-consolidation.cjs
      - name: Parent report regression
        run: node site/tests/verify-v5.8c-parent-friendly-student-report.cjs
      - name: V5.8D content workflow regression
        run: node site/tests/verify-v5.8d-content-workflow-consolidation.cjs
