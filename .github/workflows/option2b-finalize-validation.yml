name: Option 2B materialize accepted candidate

on:
  push:
    branches:
      - tech-debt-phase-4-option2b-authenticated-hub-static
    paths:
      - .github/workflows/option2b-finalize-validation.yml

permissions:
  contents: write

jobs:
  materialize:
    name: Materialize and push accepted Option 2B candidate content
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: tech-debt-phase-4-option2b-authenticated-hub-static
          fetch-depth: 0

      - name: Confirm clean pre-materialization scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          expected = {
              '.github/option2b_static_hub_patch.py',
              '.github/option2b_successor_seals.py',
              '.github/option2b_test_patch.py',
              '.github/workflows/option2b-finalize-validation.yml',
              '.github/workflows/option2b-static-hub-branch-validation.yml',
              'e2e/tests/v40-static-authenticated-home-option2b.spec.cjs',
          }
          actual = set(filter(None, subprocess.check_output([
              'git','diff','--name-only','162205ba76b08f31f0ea4bbb14cc6f5fc85c56a3','HEAD'
          ], text=True).splitlines()))
          if actual != expected:
              raise SystemExit(f'Unexpected pre-materialization diff: {sorted(actual ^ expected)}')
          print('Pre-materialization branch scope is exactly the six known temporary/seed files.')
          PY
          test "$(git rev-parse HEAD:supabase)" = 19dd92c4e1f1d7c3ab9fc522d1b1cdf191afc456

      - name: Reconstruct exact accepted runner-local candidate
        shell: bash
        run: |
          set -euo pipefail
          python .github/option2b_static_hub_patch.py
          python .github/option2b_test_patch.py
          python .github/option2b_successor_seals.py

          test "$(git hash-object site/index.html)" = be7909f3534c77b3eb570ab3b971c33f58ebdaed
          test "$(git hash-object site/v40-learning-priorities.js)" = bfec5b47eaf266486d21c96acdb4e1cfd677b328
          test "$(git hash-object site/v57c-student-continue-learning-home.js)" = 196225cf94035363869b8051bc33cdd3c03993f9
          test "$(git hash-object site/gamification-student.js)" = d9c4dc0e25cbed50346937db887a703800be5a59
          test "$(git hash-object site/v58a-student-first-use-experience.js)" = 8e0279e86b1ece862586238f99c760129c13465f

          tmp_index="$(mktemp)"
          rm -f "$tmp_index"
          export GIT_INDEX_FILE="$tmp_index"
          git read-tree be27c99196178129f42474b213c1e7586f5da647^{tree}
          git add \
            e2e/tests/v40-static-authenticated-home-option2b.spec.cjs \
            e2e/tests/v40-static-student-signin-shell-option2a.spec.cjs \
            site/index.html \
            site/v40-learning-priorities.js \
            site/v57c-student-continue-learning-home.js \
            site/gamification-student.js \
            site/v58a-student-first-use-experience.js \
            site/tests/v51-phase4-protected-shas.json \
            site/tests/verify-phase4-v50-operations-reporting-protected-sha.cjs \
            site/tests/verify-phase4-v52c-legacy-student-route-protected-sha.cjs \
            site/tests/verify-phase4-v53-practice-selection-protected-sha.cjs \
            site/tests/verify-phase4-v53-ui-resource-companion-protected-sha.cjs \
            site/tests/verify-phase4-v54-resource-bank-protected-sha.cjs \
            site/tests/verify-phase4-teacher-assignments-checkpoint2-protected-sha.cjs
          candidate_tree="$(git write-tree)"
          echo "RECONSTRUCTED_VALIDATED_CANDIDATE_TREE=$candidate_tree"
          test "$candidate_tree" = 3c9128ab5d115957121674fbf7b1eab600c2f44a
          unset GIT_INDEX_FILE
          rm -f "$tmp_index"

      - name: Commit only the validated candidate files and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            e2e/tests/v40-static-authenticated-home-option2b.spec.cjs \
            e2e/tests/v40-static-student-signin-shell-option2a.spec.cjs \
            site/index.html \
            site/v40-learning-priorities.js \
            site/v57c-student-continue-learning-home.js \
            site/gamification-student.js \
            site/v58a-student-first-use-experience.js \
            site/tests/v51-phase4-protected-shas.json \
            site/tests/verify-phase4-v50-operations-reporting-protected-sha.cjs \
            site/tests/verify-phase4-v52c-legacy-student-route-protected-sha.cjs \
            site/tests/verify-phase4-v53-practice-selection-protected-sha.cjs \
            site/tests/verify-phase4-v53-ui-resource-companion-protected-sha.cjs \
            site/tests/verify-phase4-v54-resource-bank-protected-sha.cjs \
            site/tests/verify-phase4-teacher-assignments-checkpoint2-protected-sha.cjs
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 14
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          test -z "$(git diff --cached --name-only -- supabase)"
          git commit -m 'Phase 4 Option 2B validated candidate content'
          echo "MATERIALIZED_HEAD=$(git rev-parse HEAD)"
          echo "MATERIALIZED_TREE=$(git rev-parse HEAD^{tree})"
          git push origin HEAD:tech-debt-phase-4-option2b-authenticated-hub-static
