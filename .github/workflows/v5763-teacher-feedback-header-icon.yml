name: V5.7.6.3 Teacher Feedback Header Icon

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - development/v5763-teacher-feedback-header-icon

permissions:
  contents: read

jobs:
  verify:
    name: Verify V5.7.6.3 Teacher Feedback Header Icon
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run V5.7.6 feedback support regression
        run: node site/tests/verify-v5.7.6-classroom-feedback-support.cjs
      - name: Run V5.7.6.3 teacher feedback header icon regression
        run: node site/tests/verify-v5.7.6.3-teacher-feedback-header-icon.cjs