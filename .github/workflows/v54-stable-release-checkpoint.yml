name: V5.4 Stable Release Checkpoint

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checkpoint:
    name: V5.4 stable release checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify V5.4 stable release checkpoint
        run: node site/tests/verify-v5.4-stable-release-checkpoint.cjs
