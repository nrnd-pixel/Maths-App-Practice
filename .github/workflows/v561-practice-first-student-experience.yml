name: V5.6.1 Practice First Student Experience

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - development/v561-practice-first-student-experience

permissions:
  contents: read

jobs:
  verify:
    name: Verify V5.6.1 Practice First Student Experience
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run V5.5 Past Paper Practice regression
        run: node site/tests/verify-v5.5a-past-paper-practice.cjs
      - name: Run V5.5 resume regression
        run: node site/tests/verify-v5.5c-resume-past-paper-practice.cjs
      - name: Run V5.6 teacher-assigned Past Paper regression
        run: node site/tests/verify-v5.6b-teacher-assigned-past-paper-practice.cjs
      - name: Run V5.6 student Past Paper progress regression
        run: node site/tests/verify-v5.6c-student-past-paper-progress.cjs
      - name: Run V5.6 teacher Past Paper analytics regression
        run: node site/tests/verify-v5.6d-teacher-past-paper-analytics.cjs
      - name: Run V5.6 stable checkpoint regression
        run: node site/tests/verify-v5.6-stable-release-checkpoint.cjs
      - name: Run V5.6.1 Practice-first regression
        run: node site/tests/verify-v5.6.1-practice-first-student-experience.cjs
