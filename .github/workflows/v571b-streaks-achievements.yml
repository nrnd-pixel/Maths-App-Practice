name: V5.7.1B Practice Streaks and Achievement Badges

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - development/v571b-streaks-achievements

permissions:
  contents: read

jobs:
  verify:
    name: Verify V5.7.1B Streaks and Achievements
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run V5.7 stable checkpoint regression
        run: node site/tests/verify-v5.7-stable-release-checkpoint.cjs
      - name: Run V5.7C Continue Learning Home regression
        run: node site/tests/verify-v5.7c-student-continue-learning-home.cjs
      - name: Run V5.7.1A gamification foundation regression
        run: node site/tests/verify-v5.7.1a-gamification-foundation.cjs
      - name: Run V5.7.1B streaks and achievements regression
        run: node site/tests/verify-v5.7.1b-streaks-achievements.cjs
