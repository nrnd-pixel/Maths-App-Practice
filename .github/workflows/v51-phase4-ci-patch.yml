name: Phase 4 V51 temporary CI condition patch

on:
  push:
    branches:
      - tech-debt-phase-4-v51-question-bank-management-checkpoint-1
    paths:
      - .github/workflows/v51-phase4-ci-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tech-debt-phase-4-v51-question-bank-management-checkpoint-1
          fetch-depth: 0
      - name: Add V51 validation branch to CI browser conditions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/ci.yml')
          s=p.read_text()
          old="(github.event_name == 'push' && github.ref == 'refs/heads/development/phase4-v54-resource-bank-checkpoint1-validation')"
          new="((github.event_name == 'push' && github.ref == 'refs/heads/development/phase4-v54-resource-bank-checkpoint1-validation') || (github.event_name == 'push' && github.ref == 'refs/heads/development/phase4-v51-question-bank-management-checkpoint1-validation'))"
          s=s.replace(old,new)
          dollar='$'
          desired=f"        if: {dollar}{{{{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && github.ref == 'refs/heads/development/phase4-v51-question-bank-management-checkpoint1-validation') }}}}"
          for name in ['Run V50 operations/reporting hard gates','Run V51 question-bank management hard gates']:
              lines=s.splitlines()
              for i,line in enumerate(lines):
                  if line==f'      - name: {name}':
                      if i+1>=len(lines) or not lines[i+1].lstrip().startswith('if:'):
                          raise SystemExit(f'condition line missing for {name}')
                      lines[i+1]=desired
                      break
              else:
                  raise SystemExit(f'step missing: {name}')
              s='\n'.join(lines)+'\n'
          p.write_text(s)
          PY
      - name: Commit CI condition patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml
          if git diff --cached --quiet; then echo "No CI condition changes."; exit 0; fi
          git commit -m "Phase 4 V51: enable exact-head validation branch"
          git push origin HEAD:tech-debt-phase-4-v51-question-bank-management-checkpoint-1
