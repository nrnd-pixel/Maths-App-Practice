name: Option 2A static shell runner

on:
  push:
    branches:
      - tech-debt-phase-4-option2a-static-student-signin-shell

permissions:
  contents: write

# One-shot branch validation runner; remove before the final draft PR.
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply approved Option 2A patch
        run: python .github/option2a_static_shell_patch.py

      - name: Align gate 6 with the existing access-policy copy contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('e2e/tests/v40-static-student-signin-shell-option2a.spec.cjs')
          text = path.read_text()
          replacements = [
              (
                  "    await expect(page.locator('#student-pin-wrap .help')).toContainText('Required');",
                  "    await expect(page.locator('#student-pin-wrap .help')).toContainText('Your teacher provides or resets this PIN.');",
              ),
              (
                  "    await expect(page.locator('#student-access-note')).toContainText('Protected access');",
                  "    await expect(page.locator('#student-access-note')).toContainText('Enter your Student ID and PIN');",
              ),
              (
                  "    await expect(openPage.locator('#student-name-help')).toContainText('Required for open access');",
                  "    await expect(openPage.locator('#student-name-help')).toContainText('Required when access is open');",
              ),
          ]
          for old, new in replacements:
              assert text.count(old) == 1, old
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Check patch whitespace and runtime scope
        run: |
          git diff --check
          test "$(git diff --name-only HEAD -- site supabase | sort)" = "$(printf '%s\n' site/index.html site/v40-start-shell.js site/v40-student-session.js | sort)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run maintained verifier suite
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import sys

          text = Path('.github/workflows/ci.yml').read_text()
          verifiers = []
          for verifier in re.findall(r'"(site/tests/verify-[^"]+\.cjs)"', text):
              if verifier not in verifiers:
                  verifiers.append(verifier)

          print(f'Running {len(verifiers)} maintained verifiers')
          failed = []
          for verifier in verifiers:
              print(f'==> {verifier}', flush=True)
              if subprocess.run(['node', verifier]).returncode:
                  failed.append(verifier)

          if failed:
              print('Maintained verifier failures:', *failed, sep='\n- ', file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Option 2A 12 hard gates
        working-directory: e2e
        run: npx playwright test tests/v40-static-student-signin-shell-option2a.spec.cjs --reporter=line

      - name: Run existing Phase 0 core equivalence
        working-directory: e2e
        run: npx playwright test tests/core.spec.cjs --reporter=line

      - name: Run full Playwright regression
        working-directory: e2e
        run: npx playwright test --reporter=line

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html site/v40-student-session.js site/v40-start-shell.js e2e/tests/v40-static-student-signin-shell-option2a.spec.cjs
          git commit -m "Phase 4: implement Option 2A static student sign-in shell [option2a-patched]"
          git push origin HEAD:tech-debt-phase-4-option2a-static-student-signin-shell
