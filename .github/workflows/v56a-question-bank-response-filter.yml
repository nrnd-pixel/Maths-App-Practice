name: V5.6A Question Bank Response Filter

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - development/v56a-question-bank-response-filter

permissions:
  contents: read

jobs:
  verify:
    name: Verify V5.6A Question Bank Response Filter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Question Bank performance regression
        run: node site/tests/verify-v5.2b1-question-bank-performance.cjs
      - name: Run bulk Practice eligibility regression
        run: node site/tests/verify-v5.4e-bulk-practice-eligibility.cjs
      - name: Run bulk selection scope safety regression
        run: node site/tests/verify-v5.4f-bulk-selection-scope-safety.cjs
      - name: Run V5.5 stable checkpoint regression
        run: node site/tests/verify-v5.5-stable-release-checkpoint.cjs
      - name: Run V5.6A response filter regression
        run: node site/tests/verify-v5.6a-question-bank-response-filter.cjs
