name: Temporary Option 2C manifest calculator

on:
  push:
    branches:
      - maintenance/fouc-targeted-preview-check-20260910

permissions:
  contents: read

jobs:
  calculate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: fix-static-session-mode-flash
          fetch-depth: 0

      - name: Calculate Option 2C frozen-site manifest excluding index only
        shell: bash
        run: |
          node <<'NODE'
          const crypto = require('node:crypto');
          const { execFileSync } = require('node:child_process');
          const path = require('node:path');
          const root = process.cwd();
          const git = args => execFileSync('git', args, {cwd: root, encoding:'utf8'}).trim();
          const output = git(['ls-files','-co','--exclude-standard','site']);
          const paths = output ? [...new Set(output.split(/\r?\n/).filter(Boolean))].sort() : [];
          const records = paths.filter(p => p !== 'site/index.html').map(p => `${git(['hash-object',p])}  ${p}`);
          const hash = crypto.createHash('sha256').update(records.length ? `${records.join('\n')}\n` : '').digest('hex');
          console.log('FROZEN_SITE_EXCLUDING_INDEX_SHA256=' + hash);
          console.log('INDEX_BLOB=' + git(['hash-object','site/index.html']));
          console.log('HEAD=' + git(['rev-parse','HEAD']));
          NODE
