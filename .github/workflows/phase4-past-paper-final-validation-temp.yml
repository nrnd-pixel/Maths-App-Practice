name: Phase 4 Past Paper Final Validation Temporary

on:
  push:
    branches:
      - development/phase4-past-paper-v56-v57-e2e

permissions:
  contents: read

jobs:
  validate:
    name: Final exact-head verifiers and Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact implementation head
        uses: actions/checkout@v4
        with:
          ref: 0fa12b26b5d81dc4a94a9de213332fa4af5be55d
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run maintained verifier suite exactly from Consolidated CI list
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, sys
          text=Path('.github/workflows/ci.yml').read_text()
          paths=[]
          for path in re.findall(r'"(site/tests/verify-[^"]+\.cjs)"',text):
              if path not in paths:
                  paths.append(path)
          print(f'Running {len(paths)} maintained verifier scripts from ci.yml...')
          failures=[]
          for path in paths:
              print(f'==> {path}',flush=True)
              result=subprocess.run(['node',path])
              if result.returncode:
                  failures.append(path)
          if failures:
              print('FAILED maintained verifiers:',*failures,sep='\n- ')
              sys.exit(1)
          print(f'All {len(paths)} maintained verifiers passed.')
          PY
      - name: Install E2E dependencies
        working-directory: e2e
        run: npm install --no-audit --no-fund
      - name: Install Playwright Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Run A-J checkpoint gates only
        working-directory: e2e
        run: npx playwright test tests/past-paper-phase4-v56-v57.spec.cjs
      - name: Run pre-existing Playwright specs
        working-directory: e2e
        run: npx playwright test tests/core.spec.cjs tests/past-paper.spec.cjs
      - name: Run complete Playwright suite
        working-directory: e2e
        run: npm test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-final-playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-final-playwright-test-results
          path: e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
