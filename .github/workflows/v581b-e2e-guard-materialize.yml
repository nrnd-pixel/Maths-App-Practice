name: Temporary V5.8.1B E2E guard materializer

on:
  push:
    branches:
      - maintenance/v581b-guard-materializer-20260911

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: fix/v581b-assignment-checkpoint-attribution
          fetch-depth: 0

      - name: Refresh historical successor guards only
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one occurrence, found {count}')
              return text.replace(old, new, 1)

          main_sha = '6d1cc994e479411e6af266de1ebdfa91bb57f8d1'
          migration = 'supabase/v581b_assignment_checkpoint_and_attribution_hardening.sql'
          verifier = 'site/tests/verify-v5.8.1b-checkpoint-attribution.cjs'

          a_path = Path('e2e/tests/v40-static-student-signin-shell-option2a.spec.cjs')
          a = a_path.read_text()
          a = replace_once(a,
              "const EXPECTED_FROZEN_SITE_SHA256 = '018a91f0e6c1e9b8ed6dbf76a3f26fccf11c5b4e2a9a6a1175a2f57328816137';",
              "const EXPECTED_FROZEN_SITE_SHA256 = 'a19ba041223b248a09c87c8063b2826b28fccf17b1a8fedd68dcf1082ec3dde4';",
              'Option 2A site seal')
          a = replace_once(a,
              "const EXPECTED_SUPABASE_SHA256 = '0684a8f4f9a2e9acf193aeeedecbf7825091a8a0cf9edee1f2a2d4837a6490ec';",
              "const EXPECTED_SUPABASE_SHA256 = '58fbaa5f6ebcf1fa4214429e0e9a76284897775680a93f704fb2a0455a273389';",
              'Option 2A Supabase manifest')
          a = replace_once(a,
              "const EXPECTED_SUPABASE_TREE = '19dd92c4e1f1d7c3ab9fc522d1b1cdf191afc456';",
              "const EXPECTED_SUPABASE_TREE = '204bba144a9ebe47dcbcc1bb1331c484acd0ea33';",
              'Option 2A Supabase tree')
          a_path.write_text(a)

          b_path = Path('e2e/tests/v40-static-authenticated-home-option2b.spec.cjs')
          b = b_path.read_text()
          b = replace_once(b,
              "const BASE_SHA = '653aec5e06e1bf1669b4c9c0cd3e91069715de45';",
              f"const BASE_SHA = '{main_sha}';",
              'Option 2B base SHA')
          b = replace_once(b,
              "const AUTHORIZED_RUNTIME_CHANGES = new Set([\n  'site/index.html',\n]);",
              "const AUTHORIZED_RUNTIME_CHANGES = new Set([\n  'site/tests/verify-v5.8.1b-checkpoint-attribution.cjs',\n]);",
              'Option 2B current site diff')
          b = replace_once(b,
              "    expect(changedSupabase).toBe('');",
              f"    expect(changedSupabase).toBe('{migration}');",
              'Option 2B Supabase diff')
          b_path.write_text(b)

          c_path = Path('e2e/tests/v40-static-v40-shell-option2c.spec.cjs')
          c = c_path.read_text()
          c = replace_once(c,
              "const BASE_SHA = '653aec5e06e1bf1669b4c9c0cd3e91069715de45';",
              f"const BASE_SHA = '{main_sha}';",
              'Option 2C base SHA')
          c = replace_once(c,
              "const EXPECTED_FROZEN_SITE_SHA256 = '5c9ab35280605063598b495aef32e24ba8a4c258ccf36b3f5c77e1eff3693707';",
              "const EXPECTED_FROZEN_SITE_SHA256 = '1a29b397d8777aa956c742e7807a18b78255558a2139812df71dfc7b45a49374';",
              'Option 2C site seal')
          c = replace_once(c,
              "const EXPECTED_SUPABASE_SHA256 = '0684a8f4f9a2e9acf193aeeedecbf7825091a8a0cf9edee1f2a2d4837a6490ec';",
              "const EXPECTED_SUPABASE_SHA256 = '58fbaa5f6ebcf1fa4214429e0e9a76284897775680a93f704fb2a0455a273389';",
              'Option 2C Supabase manifest')
          c = replace_once(c,
              "const EXPECTED_SUPABASE_TREE = '19dd92c4e1f1d7c3ab9fc522d1b1cdf191afc456';",
              "const EXPECTED_SUPABASE_TREE = '204bba144a9ebe47dcbcc1bb1331c484acd0ea33';",
              'Option 2C Supabase tree')
          c = replace_once(c,
              "const RUNTIME_SUCCESSORS = Object.freeze({\n  'site/index.html': 'f2c0dffc49a2e673f001975b0a707bc4a8fa0b89',\n});",
              "const RUNTIME_SUCCESSORS = Object.freeze({\n  'site/tests/verify-v5.8.1b-checkpoint-attribution.cjs': '5d88433c990bf6dfba2513113004117ef5f8c947',\n});",
              'Option 2C current site successor')
          c = replace_once(c,
              "    expect(git(['diff', '--name-only', BASE_SHA, '--', 'supabase'])).toBe('');",
              f"    expect(git(['diff', '--name-only', BASE_SHA, '--', 'supabase'])).toBe('{migration}');",
              'Option 2C Supabase diff')
          c_path.write_text(c)
          PY

          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 3
          node site/tests/verify-v5.8.1b-checkpoint-attribution.cjs

      - name: Commit guard maintenance to target branch
        shell: bash
        run: |
          git config user.name "nrnd-pixel"
          git config user.email "anuarn.edu@gmail.com"
          git add e2e/tests/v40-static-student-signin-shell-option2a.spec.cjs \
            e2e/tests/v40-static-authenticated-home-option2b.spec.cjs \
            e2e/tests/v40-static-v40-shell-option2c.spec.cjs
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m "test: refresh V40 successor guards for V5.8.1B"
          git push origin HEAD:fix/v581b-assignment-checkpoint-attribution
