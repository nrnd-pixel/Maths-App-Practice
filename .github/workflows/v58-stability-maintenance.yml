name: V5.8 Stability Maintenance

on:
  push:
    branches:
      - maintenance/v58-stability
      - development/v582-bootstrap-consolidation
  pull_request:
    branches:
      - main
    paths:
      - 'site/**'
      - 'supabase/**'
      - '.github/workflows/v58-stability-maintenance.yml'
      - 'docs/V58-STABILITY-SMOKE-CHECKLIST.md'

permissions:
  contents: read

jobs:
  verify-v58-maintenance:
    name: Verify V5.8 maintenance safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compile active browser modules and verify core invariants
        run: node site/tests/verify-v5.1.cjs

      - name: Verify accepted V5.7 foundation
        run: node site/tests/verify-v5.7-stable-release-checkpoint.cjs

      - name: Verify V5.8 first-use experience
        run: node site/tests/verify-v5.8a-student-first-use-experience.cjs

      - name: Verify V5.8 teacher workspace
        run: node site/tests/verify-v5.8b-teacher-workspace-consolidation.cjs

      - name: Verify V5.8 parent-friendly report
        run: node site/tests/verify-v5.8c-parent-friendly-student-report.cjs

      - name: Verify V5.8 content workflow consolidation
        run: node site/tests/verify-v5.8d-content-workflow-consolidation.cjs

      - name: Verify V5.8 intervention workflow
        run: node site/tests/verify-v5.8-intervention-workflow.cjs

      - name: Verify V5.8 stable release checkpoint
        run: node site/tests/verify-v5.8-stable-release-checkpoint.cjs

      - name: Verify V5.8.2 bootstrap consolidation
        run: node site/tests/verify-v5.8.2-bootstrap-consolidation.cjs
