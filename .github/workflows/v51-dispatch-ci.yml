name: Phase 4 V51 one-shot CI dispatcher

on:
  push:
    branches:
      - development/phase4-v51-ci-dispatch-helper
    paths:
      - .github/workflows/v51-dispatch-ci.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Consolidated CI on exact V51 implementation branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/nrnd-pixel/Maths-App-Practice/actions/workflows/ci.yml/dispatches \
            -d '{"ref":"tech-debt-phase-4-v51-question-bank-management-checkpoint-1"}'
