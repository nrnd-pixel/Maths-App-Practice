name: Phase 4 V51 one-shot CI patch

on:
  push:
    branches:
      - tech-debt-phase-4-v51-question-bank-management-checkpoint-1
    paths:
      - .github/workflows/v51-phase4-generate.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tech-debt-phase-4-v51-question-bank-management-checkpoint-1
          fetch-depth: 0
      - name: Patch consolidated CI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/ci.yml')
          s=p.read_text()
          if 'verify-phase4-v51-question-bank-management-integrity.cjs' not in s:
              marker='            "site/tests/verify-phase4-v50-operations-reporting-protected-sha.cjs"\n'
              addition=marker+'            "site/tests/verify-phase4-v51-question-bank-management-dormant-reference-integrity.cjs"\n            "site/tests/verify-phase4-v51-question-bank-management-integrity.cjs"\n            "site/tests/verify-phase4-v51-question-bank-management-protected-sha.cjs"\n'
              if marker not in s: raise SystemExit('Verifier insertion marker missing')
              s=s.replace(marker,addition)
          if 'Run V51 question-bank management hard gates' not in s:
              marker="""      - name: Run V50 operations/reporting hard gates
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main') }}
        working-directory: e2e
        run: npx playwright test tests/v50-operations-reporting-phase4-checkpoint1.spec.cjs --reporter=line
"""
              addition=marker+"""
      - name: Run V51 question-bank management hard gates
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main') }}
        working-directory: e2e
        run: npx playwright test tests/v51-question-bank-management-phase4-checkpoint1.spec.cjs --reporter=line
"""
              if marker not in s: raise SystemExit('Hard-gate insertion marker missing')
              s=s.replace(marker,addition)
          p.write_text(s)
          PY
      - name: Commit CI wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml
          if git diff --cached --quiet; then echo "No CI changes."; exit 0; fi
          git commit -m "Phase 4 V51: wire guards and hard gates into CI"
          git push origin HEAD:tech-debt-phase-4-v51-question-bank-management-checkpoint-1
