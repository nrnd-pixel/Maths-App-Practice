name: Phase 4 V51 one-shot consolidation generator

on:
  push:
    branches:
      - tech-debt-phase-4-v51-question-bank-management-checkpoint-1
    paths:
      - .github/workflows/v51-phase4-generate.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tech-debt-phase-4-v51-question-bank-management-checkpoint-1
          fetch-depth: 0

      - name: Build topology-preserving V51 owners
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('site')
          groups = {
              'paper-import-management.js': [
                  'v51-paper-profile-validator.js',
                  'v51-bulk-question-image-upload.js',
                  'v51-bulk-question-image-cleanup.js',
                  'v51-bulk-question-image-safety.js',
                  'v51-paper-package-preview.js',
                  'v51-paper-package-preview-status.js',
                  'v51-one-confirmation-paper-import.js',
                  'v51-post-import-integrity.js',
              ],
              'question-bank-selection-qa.js': [
                  'v51-question-bank-qa.js',
                  'v51-question-bank-bulk-status.js',
              ],
              'question-bank-metadata-review.js': [
                  'v51-question-bank-bulk-metadata.js',
                  'v51-question-review-workflow.js',
              ],
              'question-bank-audit-multipart.js': [
                  'v51-question-change-history.js',
                  'v51-multipart-question-management.js',
              ],
              'student-exam-ui.js': [
                  'v51-student-exam-paper-library.js',
                  'v51-student-exam-resume-progress.js',
              ],
          }

          for output, inputs in groups.items():
              header = (
                  '/* Phase 4 — V51 topology-preserving consolidated owner.\n'
                  '   Historical sections are retained byte-for-byte and execute in the\n'
                  '   accepted order at the same loader boundary. */\n\n'
              ).encode('utf-8')
              chunks = [header]
              for index, name in enumerate(inputs):
                  if index:
                      chunks.append(b'\n')
                  chunks.append((f'/* ---- historical owner: {name} ---- */\n').encode('utf-8'))
                  chunks.append((root / name).read_bytes())
                  if not chunks[-1].endswith(b'\n'):
                      chunks.append(b'\n')
              (root / output).write_bytes(b''.join(chunks))

          loader = root / 'v40-release.js'
          text = loader.read_text(encoding='utf-8')

          replacements = [
              (
                  "    loadScriptOnce('v51-paper-profile-validator.js?v=51a-1', 'data-v51-paper-profile-validator');\n"
                  "    loadScriptOnce('v51-bulk-question-image-upload.js?v=51a2-1', 'data-v51-bulk-question-image-upload');\n"
                  "    loadScriptOnce('v51-bulk-question-image-cleanup.js?v=51a2-1', 'data-v51-bulk-question-image-cleanup');\n"
                  "    loadScriptOnce('v51-bulk-question-image-safety.js?v=51a2-1', 'data-v51-bulk-question-image-safety');\n"
                  "    loadScriptOnce('v51-paper-package-preview.js?v=51a4-1', 'data-v51-paper-package-preview');\n"
                  "    loadScriptOnce('v51-paper-package-preview-status.js?v=51a4-1', 'data-v51-paper-package-preview-status');\n"
                  "    loadScriptOnce('v51-one-confirmation-paper-import.js?v=51a5-1', 'data-v51-one-confirmation-paper-import');\n"
                  "    loadScriptOnce('v51-post-import-integrity.js?v=51a6-1', 'data-v51-post-import-integrity');",
                  "    loadScriptOnce('paper-import-management.js', 'data-paper-import-management');",
              ),
              (
                  "    loadScriptOnce('v51-question-bank-qa.js?v=51b1-1', 'data-v51-question-bank-qa');\n"
                  "    loadScriptOnce('v51-question-bank-bulk-status.js?v=51b2a-1', 'data-v51-question-bank-bulk-status');",
                  "    loadScriptOnce('question-bank-selection-qa.js', 'data-question-bank-selection-qa');",
              ),
              (
                  "    loadScriptOnce('v51-question-bank-bulk-metadata.js?v=51b2b-1', 'data-v51-question-bank-bulk-metadata');\n"
                  "    loadScriptOnce('v51-question-review-workflow.js?v=51b2c-1', 'data-v51-question-review-workflow');",
                  "    loadScriptOnce('question-bank-metadata-review.js', 'data-question-bank-metadata-review');",
              ),
              (
                  "    loadScriptOnce('v51-question-change-history.js?v=51b2d-1', 'data-v51-question-change-history');\n"
                  "    loadScriptOnce('v51-multipart-question-management.js?v=51b2e-1', 'data-v51-multipart-question-management');",
                  "    loadScriptOnce('question-bank-audit-multipart.js', 'data-question-bank-audit-multipart');",
              ),
              (
                  "    loadScriptOnce('v51-student-exam-paper-library.js?v=51c1-1', 'data-v51c1-student-exam-paper-library');\n"
                  "    loadScriptOnce('v51-student-exam-resume-progress.js?v=51c2-1', 'data-v51c2-student-exam-resume-progress');",
                  "    loadScriptOnce('student-exam-ui.js', 'data-student-exam-ui');",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one loader block, found {count}: {old.splitlines()[0]}')
              text = text.replace(old, new)

          loader.write_text(text, encoding='utf-8')
          PY

      - name: Commit generated owners
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/paper-import-management.js \
                  site/question-bank-selection-qa.js \
                  site/question-bank-metadata-review.js \
                  site/question-bank-audit-multipart.js \
                  site/student-exam-ui.js \
                  site/v40-release.js
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Phase 4 V51: generate topology-preserving owners"
          git push origin HEAD:tech-debt-phase-4-v51-question-bank-management-checkpoint-1
