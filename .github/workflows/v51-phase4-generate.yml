name: Phase 4 V51 one-shot consolidation generator

on:
  push:
    branches:
      - tech-debt-phase-4-v51-question-bank-management-checkpoint-1
    paths:
      - .github/workflows/v51-phase4-generate.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tech-debt-phase-4-v51-question-bank-management-checkpoint-1
          fetch-depth: 0

      - name: Build V51 owners and checkpoint guards
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re, subprocess

          BASE='51863ca14e54658fa3921dee5ece9aac59b6f74c'
          root=Path('site')
          tests=root/'tests'
          groups={
              'paper-import-management.js':[
                  'v51-paper-profile-validator.js','v51-bulk-question-image-upload.js',
                  'v51-bulk-question-image-cleanup.js','v51-bulk-question-image-safety.js',
                  'v51-paper-package-preview.js','v51-paper-package-preview-status.js',
                  'v51-one-confirmation-paper-import.js','v51-post-import-integrity.js'],
              'question-bank-selection-qa.js':['v51-question-bank-qa.js','v51-question-bank-bulk-status.js'],
              'question-bank-metadata-review.js':['v51-question-bank-bulk-metadata.js','v51-question-review-workflow.js'],
