name: V5 Regression Safety

on:
  pull_request:
    branches:
      - main
      - feature-v5.0
  push:
    branches:
      - feature-v5.0
      - feature-v5.0b1-regression-safety

permissions:
  contents: read

jobs:
  regression:
    name: V5 regression safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify current app invariants
        run: node site/tests/verify-v5.0.cjs
      - name: Verify accessibility invariants
        run: node site/tests/verify-v5.0-accessibility.cjs
      - name: Verify reporting invariants
        run: node site/tests/verify-v5.0-reporting.cjs
      - name: Verify launch readiness invariants
        run: node site/tests/verify-v5.0-launch-readiness.cjs
      - name: Verify launch reset safe-delete hotfix
        run: node site/tests/verify-v5.0-launch-reset-hotfix.cjs
      - name: Verify teacher operations invariants
        run: node site/tests/verify-v5.0-teacher-operations.cjs
      - name: Verify roster identity edit invariants
        run: node site/tests/verify-v5.0-roster-edit.cjs
      - name: Verify release-candidate functional audit
        run: node site/tests/verify-v5.0-release-audit.cjs
      - name: Verify release-candidate security audit
        run: node site/tests/verify-v5.0-security-audit.cjs
      - name: Verify RC2 empty result-code audit
        run: node site/tests/verify-v5.0-rc2-empty-result-code-audit.cjs
      - name: Verify release-candidate production polish
        run: node site/tests/verify-v5.0-production-polish.cjs
      - name: Verify V5.1A paper profile validator
        run: node site/tests/verify-v5.1a-paper-profile-validator.cjs
      - name: Verify V5.1A2 bulk question image upload
        run: node site/tests/verify-v5.1a2-bulk-question-image-upload.cjs
      - name: Verify V5.1A2 abandoned image cleanup
        run: node site/tests/verify-v5.1a2-bulk-image-cleanup.cjs
      - name: Verify V5.1A2 image persistence safety
        run: node site/tests/verify-v5.1a2-image-safety.cjs
      - name: Verify V5.1A4 paper package preview
        run: node site/tests/verify-v5.1a4-paper-package-preview.cjs
      - name: Verify V5.1A4 package status wording
        run: node site/tests/verify-v5.1a4-package-status.cjs
      - name: Verify V5.1A5 one-confirmation paper import
        run: node site/tests/verify-v5.1a5-one-confirmation-paper-import.cjs
      - name: Verify V5.1A6 post-import integrity
        run: node site/tests/verify-v5.1a6-post-import-integrity.cjs
      - name: Verify V5.1B1 Question Bank QA
        run: node site/tests/verify-v5.1b1-question-bank-qa.cjs
      - name: Verify V5.1B1 loader wiring
        run: node site/tests/verify-v5.1b1-question-bank-qa-loader.cjs
      - name: Verify V5.1B2A bulk activate/deactivate
        run: node site/tests/verify-v5.1b2a-bulk-activate-deactivate.cjs
      - name: Verify V5.1B2A loader wiring
        run: node site/tests/verify-v5.1b2a-bulk-status-loader.cjs
      - name: Verify V5.1B2B bulk metadata
        run: node site/tests/verify-v5.1b2b-bulk-metadata.cjs
      - name: Verify V5.1B2B loader wiring
        run: node site/tests/verify-v5.1b2b-bulk-metadata-loader.cjs
      - name: Verify V5.1B2C question review workflow
        run: node site/tests/verify-v5.1b2c-question-review-workflow.cjs
      - name: Verify V5.1B2C loader wiring
        run: node site/tests/verify-v5.1b2c-question-review-loader.cjs
      - name: Verify V5.1B2D correction audit history
        run: node site/tests/verify-v5.1b2d-correction-audit-history.cjs
      - name: Verify V5.1B2D loader wiring
        run: node site/tests/verify-v5.1b2d-correction-audit-history-loader.cjs
      - name: Verify V5.1B2E multipart question management
        run: node site/tests/verify-v5.1b2e-multipart-question-management.cjs
      - name: Verify V5.1B2E loader wiring
        run: node site/tests/verify-v5.1b2e-multipart-question-management-loader.cjs
      - name: Verify V5.1B3 exam publication safety
        run: node site/tests/verify-v5.1b3-exam-publication-safety.cjs
      - name: Verify V5.1B3 loader wiring
        run: node site/tests/verify-v5.1b3-exam-publication-safety-loader.cjs
      - name: Verify V5.1B3 guarded bulk Exam Settings
        run: node site/tests/verify-v5.1b3-exam-publication-bulk-guard.cjs
