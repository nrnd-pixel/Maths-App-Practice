name: V5.9B Interactive Adaptive Diagnostic Pilot

on:
  pull_request:
    branches:
      - main
    paths:
      - 'site/v59-adaptive-diagnostic-pilot.js'
      - 'site/tests/verify-v5.9-adaptive-diagnostic-pilot.cjs'
      - 'site/config.js'
      - '.github/workflows/v59-adaptive-diagnostic-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify test-only interactive adaptive pilot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify V5.9B interactive adaptive diagnostic pilot
        run: node site/tests/verify-v5.9-adaptive-diagnostic-pilot.cjs
