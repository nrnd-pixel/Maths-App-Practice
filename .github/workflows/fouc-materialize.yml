name: Temporary FOUC materializer

on:
  push:
    branches:
      - maintenance/fouc-materialize-20260910

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/fouc-materialize-20260910
          fetch-depth: 0

      - name: Apply exact FOUC patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('site/index.html')
          text = index.read_text(encoding='utf-8')
          needle = '<style>\n  \n:root{'
          replacement = '<style>\n  \n#start { visibility: hidden; }\n:root{'
          if text.count(needle) != 1:
              raise SystemExit(f'index insertion anchor count was {text.count(needle)}, expected 1')
          index.write_text(text.replace(needle, replacement, 1), encoding='utf-8')

          shell = Path('site/v40-start-shell.js')
          text = shell.read_text(encoding='utf-8')
          needle = "    document.addEventListener('click', handleNavigationClick, true);\n  }"
          replacement = "    document.addEventListener('click', handleNavigationClick, true);\n    document.getElementById('start').style.visibility = 'visible';\n  }"
          if text.count(needle) != 1:
              raise SystemExit(f'start-shell insertion anchor count was {text.count(needle)}, expected 1')
          shell.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY

      - name: Commit materialized blobs
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add site/index.html site/v40-start-shell.js
          git commit -m "materialize: standalone V40 shell FOUC fix"
          git push origin HEAD:maintenance/fouc-materialize-20260910
