            "site/tests/verify-v5.3d1-teacher-practice-pool-alignment.cjs"
            "site/tests/verify-v5.3d2-practice-recommendation-alignment.cjs"
            "site/tests/verify-v5.3d3-practice-selection-quality.cjs"
            "site/tests/verify-v5.3d4-student-recommendation-alignment.cjs"
            "site/tests/verify-v5.3d5-practice-selection-intelligence.cjs"
            "site/tests/verify-v5.3d6-resource-bank-status-clarity.cjs"
            "site/tests/verify-phase4-v53-ui-resource-companion-integrity.cjs"
            "site/tests/verify-phase4-v54-resource-bank-dormant-reference-integrity.cjs"
            "site/tests/verify-phase4-v54-resource-bank-integrity.cjs"
            "site/tests/verify-phase4-v54-resource-bank-protected-sha.cjs"
            "site/tests/verify-v5.4a-resource-bank-visibility.cjs"
            "site/tests/verify-v5.4b-practice-eligibility-controls.cjs"
            "site/tests/verify-v5.4c-compact-question-bank.cjs"
            "site/tests/verify-v5.4d-topical-resource-simplification.cjs"
            "site/tests/verify-v5.4e-bulk-practice-eligibility.cjs"
            "site/tests/verify-v5.4f-bulk-selection-scope-safety.cjs"
            "site/tests/verify-v5.4g-paged-manual-bulk-selection.cjs"
