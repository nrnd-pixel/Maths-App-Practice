name: Consolidated CI

on:
  pull_request:
    branches:
      - main
      - feature-v5.0
  push:
    branches:
      - 'development/**'
      - 'maintenance/**'
      - feature-v5.0
      - feature-v5.0b1-regression-safety
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: consolidated-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Full regression and core browser flows
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run maintained verifier suite
        id: verifiers
        continue-on-error: true
        shell: bash
        run: |
          set -u
          verifiers=(
            "site/tests/verify-v5.1.cjs"
            "site/tests/verify-phase2-version-source-integrity.cjs"
            "site/tests/verify-v5.0-accessibility.cjs"
            "site/tests/verify-v5.0-reporting.cjs"
            "site/tests/verify-v5.0-launch-readiness.cjs"
            "site/tests/verify-v5.0-launch-reset-hotfix.cjs"
            "site/tests/verify-v5.0-teacher-operations.cjs"
            "site/tests/verify-v5.0-roster-edit.cjs"
            "site/tests/verify-v5.0-release-audit.cjs"
            "site/tests/verify-v5.0-security-audit.cjs"
            "site/tests/verify-v5.0-rc2-empty-result-code-audit.cjs"
            "site/tests/verify-v5.1-production-polish.cjs"
            "site/tests/verify-phase4-v50-operations-reporting-dormant-reference-integrity.cjs"
            "site/tests/verify-phase4-v50-operations-reporting-integrity.cjs"
            "site/tests/verify-phase4-v50-operations-reporting-protected-sha.cjs"
            "site/tests/verify-phase4-v51-question-bank-management-dormant-reference-integrity.cjs"
            "site/tests/verify-phase4-v51-question-bank-management-integrity.cjs"
            "site/tests/verify-phase4-v51-question-bank-management-protected-sha.cjs"
            "site/tests/verify-v5.1a-paper-profile-validator.cjs"
            "site/tests/verify-v5.1a2-bulk-question-image-upload.cjs"
            "site/tests/verify-v5.1a2-bulk-image-cleanup.cjs"
            "site/tests/verify-v5.1a2-image-safety.cjs"
            "site/tests/verify-v5.1a4-paper-package-preview.cjs"
            "site/tests/verify-v5.1a4-package-status.cjs"
            "site/tests/verify-v5.1a5-one-confirmation-paper-import.cjs"
            "site/tests/verify-v5.1a6-post-import-integrity.cjs"
            "site/tests/verify-v5.1b1-question-bank-qa.cjs"
            "site/tests/verify-v5.1b1-question-bank-qa-loader.cjs"
            "site/tests/verify-v5.1b2a-bulk-activate-deactivate.cjs"
            "site/tests/verify-v5.1b2a-bulk-status-loader.cjs"
            "site/tests/verify-v5.1b2b-bulk-metadata.cjs"
            "site/tests/verify-v5.1b2b-bulk-metadata-loader.cjs"
            "site/tests/verify-v5.1b2c-question-review-workflow.cjs"
