            "site/tests/verify-v5.6a1-bulk-practice-confirmation-bridge.cjs"
            "site/tests/verify-v5.6b-teacher-assigned-past-paper-practice.cjs"
            "site/tests/verify-v5.6c-student-past-paper-progress.cjs"
            "site/tests/verify-v5.6d-teacher-past-paper-analytics.cjs"
            "site/tests/verify-v5.6-stable-release-checkpoint.cjs"
            "site/tests/verify-v5.6.1-practice-first-student-experience.cjs"
            "site/tests/verify-v5.7a-cross-device-past-paper-resume.cjs"
            "site/tests/verify-v5.7b-teacher-assignment-management.cjs"
            "site/tests/verify-v5.7c-student-continue-learning-home.cjs"
            "site/tests/verify-v5.7d-past-paper-analytics-actions.cjs"
            "site/tests/verify-v5.7d1-focus-plan-copy-fallback.cjs"
            "site/tests/verify-v5.7-stable-release-checkpoint.cjs"
            "site/tests/verify-v5.7.1a-gamification-foundation.cjs"
            "site/tests/verify-v5.7.1b-streaks-achievements.cjs"
            "site/tests/verify-v5.7.2-weekly-missions.cjs"
            "site/tests/verify-v5.7.3-class-challenges-teacher-gamification.cjs"
            "site/tests/verify-v5.7.4-gamification-polish-teacher-controls.cjs"
            "site/tests/verify-v5.7.5-gamification-stable-checkpoint.cjs"
            "site/tests/verify-v5.7.6-classroom-feedback-support.cjs"
            "site/tests/verify-v5.7.6.3-teacher-feedback-header-icon.cjs"
            "site/tests/verify-v5.8a-student-first-use-experience.cjs"
            "site/tests/verify-v5.8b-teacher-workspace-consolidation.cjs"
            "site/tests/verify-v5.8c-parent-friendly-student-report.cjs"
            "site/tests/verify-v5.8d-content-workflow-consolidation.cjs"
            "site/tests/verify-v581a-practice-cloud-result-reconciliation.cjs"
            "site/tests/verify-v5.8.1b-checkpoint-attribution.cjs"
            "site/tests/verify-v5.8-intervention-workflow.cjs"
            "site/tests/verify-v5.8-stable-release-checkpoint.cjs"
          )

          echo "Running ${#verifiers[@]} maintained verifier scripts..."
          failures=0
          for verifier in "${verifiers[@]}"; do
            echo "==> ${verifier}"
            if ! node "${verifier}"; then
              echo "::error::${verifier} failed"
              failures=$((failures + 1))
            fi
          done

          if [ "${failures}" -ne 0 ]; then
            echo "::error::${failures} maintained verifier(s) failed"
            exit 1
          fi

      - name: Install E2E dependencies
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && github.ref == 'refs/heads/development/phase4-v54-resource-bank-checkpoint1-validation') }}
        working-directory: e2e
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && github.ref == 'refs/heads/development/phase4-v54-resource-bank-checkpoint1-validation') }}
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Option 2C static V40 shell hard gates
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main') }}
        working-directory: e2e
        run: npx playwright test tests/v40-static-v40-shell-option2c.spec.cjs --reporter=line

      - name: Run Option 2B static authenticated Home hard gates
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main') }}
        working-directory: e2e
        run: npx playwright test tests/v40-static-authenticated-home-option2b.spec.cjs --reporter=line

      - name: Run V52C legacy topical hard gates
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && github.ref == 'refs/heads/development/phase4-v54-resource-bank-checkpoint1-validation') }}
        working-directory: e2e
        run: npx playwright test tests/v52c-legacy-student-route-phase4-checkpoint1.spec.cjs --reporter=line

      - name: Run V54 resource-bank hard gates
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && github.ref == 'refs/heads/development/phase4-v54-resource-bank-checkpoint1-validation') }}
        working-directory: e2e
        run: npx playwright test tests/v54-resource-bank-phase4-checkpoint1.spec.cjs --reporter=line

      - name: Run V50 operations/reporting hard gates
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main') }}
        working-directory: e2e
        run: npx playwright test tests/v50-operations-reporting-phase4-checkpoint1.spec.cjs --reporter=line

      - name: Run V51 question-bank management hard gates
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main') }}
        working-directory: e2e
        run: npx playwright test tests/v51-question-bank-management-phase4-checkpoint1.spec.cjs --reporter=line

      - name: Run V52B1 observer-gate adversarial hard gates
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main') }}
        working-directory: e2e
        run: npx playwright test tests/v52b1-observer-gate-phase4-adversarial.spec.cjs --reporter=line

      - name: Run core browser tests
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && github.ref == 'refs/heads/development/phase4-v54-resource-bank-checkpoint1-validation') }}
        working-directory: e2e
        run: npm test

      - name: Upload Playwright report on failure
        if: ${{ failure() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && github.ref == 'refs/heads/development/phase4-v54-resource-bank-checkpoint1-validation')) }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright traces on failure
        if: ${{ failure() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && github.ref == 'refs/heads/development/phase4-v54-resource-bank-checkpoint1-validation')) }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail job if maintained verifiers failed
        if: ${{ always() && steps.verifiers.outcome == 'failure' }}
        run: |
          echo "One or more maintained verifier scripts failed."
          exit 1
