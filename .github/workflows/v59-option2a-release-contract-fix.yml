name: V5.9 Option 2A Release Contract Fix

on:
  push:
    branches:
      - development/197-v59a-student-home-refresh-successor

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Align exact release literals and remove helper
        shell: bash
        run: |
          set -euo pipefail
          spec='e2e/tests/v40-static-student-signin-shell-option2a.spec.cjs'
          helper='.github/workflows/v59-option2a-release-contract-fix.yml'
          test "$(grep -Fxc "    expect(identity.releaseVersion).toBe('5.8.1');" "$spec")" = '1'
          test "$(grep -Fxc "    expect(identity.badgeText).toBe('Version 5.8.1 • Stable Release');" "$spec")" = '1'
          sed -i "s/expect(identity.releaseVersion).toBe('5\.8\.1');/expect(identity.releaseVersion).toBe('5.9');/" "$spec"
          sed -i "s/Version 5\.8\.1 • Stable Release/Version 5.9 • Stable Release/" "$spec"
          rm "$helper"
          git diff --check
          git config user.name 'nrnd-pixel'
          git config user.email '318081169+nrnd-pixel@users.noreply.github.com'
          git add "$spec" "$helper"
          git commit -m 'test(v5.9): align Option 2A release identity'
          git push origin HEAD:development/197-v59a-student-home-refresh-successor
