name: Science V0.1 Shared Subject Home

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/science-v0.1-synced

permissions:
  contents: read

jobs:
  verify:
    name: Verify preview subject home and Maths baseline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify shared subject home
        run: node site/tests/verify-science-v01-subject-home.cjs
      - name: Verify current Maths invariants
        run: node site/tests/verify-v5.1.cjs
      - name: Verify latest Maths release checkpoint
        run: node site/tests/verify-v5.6c-student-past-paper-progress.cjs
