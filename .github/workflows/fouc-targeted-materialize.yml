name: Temporary targeted FOUC materializer

on:
  push:
    branches:
      - maintenance/fouc-targeted-materializer-20260910

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: fix-static-session-mode-flash
          fetch-depth: 0

      - name: Replace stale direct-child mode selector
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('site/index.html')
          data = path.read_bytes()
          old = b'#start.v40-shell-logged-out > .mode-switch { display: none !important; }'
          new = b'#start.v40-shell-logged-out .v40c-learn-setup { display: none !important; }'

          if data.count(old) != 1:
              raise SystemExit(f'expected exactly one old selector, found {data.count(old)}')
          if new in data:
              raise SystemExit('replacement selector already exists')

          updated = data.replace(old, new, 1)
          path.write_bytes(updated)
          PY

          changed="$(git diff --name-only)"
          test "$changed" = "site/index.html"
          read additions deletions path <<EOF
          $(git diff --numstat -- site/index.html)
          EOF
          test "$additions" = "1"
          test "$deletions" = "1"
          test "$path" = "site/index.html"

          git diff --check
          git diff -- site/index.html

      - name: Commit target-branch selector correction
        shell: bash
        run: |
          git config user.name "nrnd-pixel"
          git config user.email "anuarn.edu@gmail.com"
          git add site/index.html
          test "$(git diff --cached --name-only)" = "site/index.html"
          git commit -m "fix: hide static Learn shell while logged out"
          git push origin HEAD:fix-static-session-mode-flash
