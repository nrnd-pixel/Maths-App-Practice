name: Temporary Option 2B guard maintenance materializer

on:
  push:
    branches:
      - maintenance/fouc-targeted-materializer-20260910

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: fix-static-session-mode-flash
          fetch-depth: 0

      - name: Refresh Option 2B current-main diff guard
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('e2e/tests/v40-static-authenticated-home-option2b.spec.cjs')
          text = path.read_text()

          old_base = "const BASE_SHA = 'cacf5d0a2e1b921275dbde9a1a115576d1046b64';"
          new_base = "const BASE_SHA = '653aec5e06e1bf1669b4c9c0cd3e91069715de45';"
          old_runtime = """const AUTHORIZED_RUNTIME_CHANGES = new Set([\n  'site/index.html',\n  'site/v40-student-nav.js',\n  'site/v40-learn-setup.js',\n]);"""
          new_runtime = """const AUTHORIZED_RUNTIME_CHANGES = new Set([\n  'site/index.html',\n]);"""

          for old, new in ((old_base, new_base), (old_runtime, new_runtime)):
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one maintenance target, found {text.count(old)}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          test "$(git diff --name-only)" = "e2e/tests/v40-static-authenticated-home-option2b.spec.cjs"
          git diff --check
          git diff -- e2e/tests/v40-static-authenticated-home-option2b.spec.cjs

      - name: Commit guard-only maintenance to target branch
        shell: bash
        run: |
          git config user.name "nrnd-pixel"
          git config user.email "anuarn.edu@gmail.com"
          git add e2e/tests/v40-static-authenticated-home-option2b.spec.cjs
          test "$(git diff --cached --name-only)" = "e2e/tests/v40-static-authenticated-home-option2b.spec.cjs"
          git commit -m "test: refresh Option 2B current-main diff guard"
          git push origin HEAD:fix-static-session-mode-flash
