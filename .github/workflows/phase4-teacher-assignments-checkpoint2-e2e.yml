name: Phase 4 Teacher Assignments Checkpoint 2 Validation

on:
  push:
    branches:
      - tech-debt-phase-4-teacher-assignments-v44-v47-v48-checkpoint-2
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: phase4-teacher-assignments-checkpoint2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Maintained verifiers, protected SHA audit, and full staged Playwright A-L
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run maintained verifier suite
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t verifiers < <(
            sed -n '/^[[:space:]]*verifiers=(/,/^[[:space:]]*)/p' .github/workflows/ci.yml \
              | grep -o '"site/tests/verify-[^"]*\.cjs"' \
              | tr -d '"'
          )
          if [ "${#verifiers[@]}" -eq 0 ]; then
            echo "::error::Could not discover the maintained verifier list from Consolidated CI"
            exit 1
          fi
          echo "Running ${#verifiers[@]} maintained verifier scripts..."
          for verifier in "${verifiers[@]}"; do
            echo "==> ${verifier}"
            node "${verifier}"
          done

      - name: Run Checkpoint 2 protected SHA audit
        run: node site/tests/verify-phase4-teacher-assignments-checkpoint2-protected-sha.cjs

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run full staged Playwright suite
        working-directory: e2e
        run: npm test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: teacher-assignments-checkpoint2-playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: teacher-assignments-checkpoint2-test-results
          path: e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Wait for temporary workflow cleanup and dispatch Consolidated CI
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: tech-debt-phase-4-teacher-assignments-v44-v47-v48-checkpoint-2
          TEMP_WORKFLOW: .github/workflows/phase4-teacher-assignments-checkpoint2-e2e.yml
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          for attempt in $(seq 1 60); do
            current_sha=$(curl -fsSL "${auth[@]}" "${api}/git/ref/heads/${BRANCH}" | jq -r '.object.sha')
            status=$(curl -sS -o /tmp/temp-workflow.json -w '%{http_code}' "${auth[@]}" "${api}/contents/${TEMP_WORKFLOW}?ref=${BRANCH}")
            if [[ "${current_sha}" != "${GITHUB_SHA}" && "${status}" == "404" ]]; then
              echo "Temporary validator removed at final cleanup head ${current_sha}. Dispatching Consolidated CI."
              payload=$(jq -nc --arg ref "${BRANCH}" '{ref:$ref}')
              curl -fsSL -X POST "${auth[@]}" -H 'Content-Type: application/json' \
                "${api}/actions/workflows/ci.yml/dispatches" -d "${payload}"
              echo "Final cleanup head dispatched to ci.yml: ${current_sha}"
              exit 0
            fi
            echo "Waiting for cleanup commit (attempt ${attempt}/60; current=${current_sha}; temp-workflow-status=${status})"
            sleep 10
          done
          echo "::error::Temporary validation workflow was not removed in time; Consolidated CI was not dispatched."
          exit 1
