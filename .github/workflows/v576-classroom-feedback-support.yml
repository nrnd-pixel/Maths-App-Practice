name: V5.7.6 Classroom Feedback and Support

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - development/v576-classroom-feedback-support

permissions:
  contents: read

jobs:
  verify:
    name: Verify V5.7.6 Classroom Feedback and Support
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run V5.7.5 stable checkpoint regression
        run: node site/tests/verify-v5.7.5-gamification-stable-checkpoint.cjs
      - name: Run V5.7.6 feedback support regression
        run: node site/tests/verify-v5.7.6-classroom-feedback-support.cjs
