name: V5.9 Desktop Session Compatibility Fix

on:
  push:
    branches:
      - automation/v59a-production-promotion
    paths:
      - .github/workflows/v59a-production-promotion.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development/197-v59a-student-home-refresh-successor
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Preserve desktop session controls while keeping accepted mobile V5.9 layout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "be96ccf908f846fc2b2f190c705781947b0ac3f7"

          python <<'PY'
          from pathlib import Path

          path = Path('site/v59a-student-home-refresh.js')
          text = path.read_text()

          global_hide = '      #start.v40-shell-authenticated[data-v40-start-view="home"]>.v40c-session-panel{display:none!important}\n'
          assert text.count(global_hide) == 1
          text = text.replace(global_hide, '', 1)

          mobile_anchor = '      @media(max-width:760px){\n        body.v59a-student-active{padding-bottom:84px}\n'
          mobile_replacement = '      @media(max-width:760px){\n        body.v59a-student-active{padding-bottom:84px}\n        #start.v40-shell-authenticated[data-v40-start-view="home"]>.v40c-session-panel{display:none!important}\n'
          assert text.count(mobile_anchor) == 1
          text = text.replace(mobile_anchor, mobile_replacement, 1)

          path.write_text(text)
          PY

          export RUNTIME_BLOB="$(git hash-object site/v59a-student-home-refresh.js)"
          python <<'PY'
          from pathlib import Path
          import os, re

          path = Path('e2e/tests/v40-static-v40-shell-option2c.spec.cjs')
          text = path.read_text()
          pattern = r"'site/v59a-student-home-refresh\.js': '[0-9a-f]{40}'"
          replacement = f"'site/v59a-student-home-refresh.js': '{os.environ['RUNTIME_BLOB']}'"
          text, count = re.subn(pattern, replacement, text, count=1)
          assert count == 1, count
          path.write_text(text)
          PY

          node --check site/v59a-student-home-refresh.js
          node --check e2e/tests/v40-static-v40-shell-option2c.spec.cjs
          node site/tests/verify-v59a-student-home-refresh-test-contract.cjs

          python <<'PY'
          import subprocess
          changed = sorted(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          expected = sorted([
              'e2e/tests/v40-static-v40-shell-option2c.spec.cjs',
              'site/v59a-student-home-refresh.js',
          ])
          assert changed == expected, (changed, expected)
          assert not subprocess.check_output(['git','diff','--name-only','--','supabase'], text=True).strip()
          frozen = {
              'site/v40-student-session.js','site/v40-platform-polish.js','site/v40-release.js',
              'site/v40-start-shell.js','site/v41-signin-guard.js','site/v51-exam-publication-safety.js',
              'site/v50-security-hardening.js','site/v52b1-question-bank-observer-gate.js',
              'site/v581a-practice-cloud-result-reconciliation.js',
          }
          assert not frozen.intersection(changed), frozen.intersection(changed)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/v59a-student-home-refresh.js e2e/tests/v40-static-v40-shell-option2c.spec.cjs
          git commit -m 'fix: preserve protected desktop session controls in V5.9'
          git push origin HEAD:development/197-v59a-student-home-refresh-successor
