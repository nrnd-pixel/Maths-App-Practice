name: V5.9 Desktop Nav Compatibility Fix

on:
  push:
    branches:
      - automation/v59a-production-promotion
    paths:
      - .github/workflows/v59a-production-promotion.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development/197-v59a-student-home-refresh-successor
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Preserve desktop V40 nav while keeping accepted mobile V5.9 nav
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "b442f8d18d35c0b6ef97087871c927466e330466"

          python <<'PY'
          from pathlib import Path

          path = Path('site/v59a-student-home-refresh.js')
          text = path.read_text()

          old_body = 'body.v59a-student-active{--v59a-ink:#10205a;--v59a-muted:#526a9a;--v59a-purple:#6434e6;--v59a-blue:#1476ea;--v59a-shadow:0 10px 28px rgba(36,76,132,.09);padding-bottom:86px}'
          new_body = 'body.v59a-student-active{--v59a-ink:#10205a;--v59a-muted:#526a9a;--v59a-purple:#6434e6;--v59a-blue:#1476ea;--v59a-shadow:0 10px 28px rgba(36,76,132,.09);padding-bottom:0}'
          assert text.count(old_body) == 1
          text = text.replace(old_body, new_body, 1)

          global_hide = '      #start.v40-shell-authenticated[data-v40-start-view="home"]>.v40-student-nav{display:none!important}\n'
          assert text.count(global_hide) == 1
          text = text.replace(global_hide, '', 1)

          old_nav = '#${MOBILE_NAV_ID}{position:fixed;z-index:46;left:0;right:0;bottom:0;height:78px;padding:7px max(10px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));display:grid;grid-template-columns:repeat(5,1fr);gap:3px;background:color-mix(in srgb,var(--card) 94%,transparent);border-top:1px solid var(--border);box-shadow:0 -9px 28px rgba(15,23,42,.09);backdrop-filter:blur(14px)}'
          new_nav = '#${MOBILE_NAV_ID}{position:fixed;z-index:46;left:0;right:0;bottom:0;height:78px;padding:7px max(10px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));display:none;grid-template-columns:repeat(5,1fr);gap:3px;background:color-mix(in srgb,var(--card) 94%,transparent);border-top:1px solid var(--border);box-shadow:0 -9px 28px rgba(15,23,42,.09);backdrop-filter:blur(14px)}'
          assert text.count(old_nav) == 1
          text = text.replace(old_nav, new_nav, 1)

          mobile_anchor = '      @media(max-width:760px){\n        body.v59a-student-active{padding-bottom:84px}\n'
          mobile_replacement = '      @media(max-width:760px){\n        body.v59a-student-active{padding-bottom:84px}\n        #start.v40-shell-authenticated[data-v40-start-view="home"]>.v40-student-nav{display:none!important}\n        #${MOBILE_NAV_ID}{display:grid}\n'
          assert text.count(mobile_anchor) == 1
          text = text.replace(mobile_anchor, mobile_replacement, 1)

          path.write_text(text)
          PY

          export RUNTIME_BLOB="$(git hash-object site/v59a-student-home-refresh.js)"
          python <<'PY'
          from pathlib import Path
          import os

          path = Path('e2e/tests/v40-static-v40-shell-option2c.spec.cjs')
          text = path.read_text()
          old = "'site/v59a-student-home-refresh.js': 'ba8ffac38d359782370431d938c331fcd966d3a8'"
          new = f"'site/v59a-student-home-refresh.js': '{os.environ['RUNTIME_BLOB']}'"
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          node --check site/v59a-student-home-refresh.js
          node --check e2e/tests/v40-static-v40-shell-option2c.spec.cjs
          node site/tests/verify-v59a-student-home-refresh-test-contract.cjs

          python <<'PY'
          import subprocess
          changed = sorted(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          expected = sorted([
              'e2e/tests/v40-static-v40-shell-option2c.spec.cjs',
              'site/v59a-student-home-refresh.js',
          ])
          assert changed == expected, (changed, expected)
          assert not subprocess.check_output(['git','diff','--name-only','--','supabase'], text=True).strip()
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/v59a-student-home-refresh.js e2e/tests/v40-static-v40-shell-option2c.spec.cjs
          git commit -m 'fix: preserve protected desktop navigation in V5.9'
          git push origin HEAD:development/197-v59a-student-home-refresh-successor
