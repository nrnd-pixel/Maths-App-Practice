name: Phase 4 V51 temporary loader verifier repair

on:
  push:
    branches:
      - tech-debt-phase-4-v51-question-bank-management-checkpoint-1
    paths:
      - .github/workflows/v51-repair-loaders.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tech-debt-phase-4-v51-question-bank-management-checkpoint-1
          fetch-depth: 0
      - name: Retarget loader verifiers to consolidated owners
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          tests=Path('site/tests')

          p=tests/'verify-v5.1a-paper-profile-validator.cjs'
          s=p.read_text()
          s=s.replace("assert.match(release,/paper-import-management\\.js\\?v=51a-1', 'data-paper-import-management'/,\n  'Stable loader must include the V5.1A paper-profile validator exactly once.');",
                      "assert.match(release,/loadScriptOnce\\('paper-import-management\\.js', 'data-paper-import-management'\\)/,\n  'Stable loader must include the consolidated V5.1 paper-import owner exactly once.');")
          if "const readOwner = fs.readFileSync(path.join(siteRoot,'paper-import-management.js'),'utf8');" not in s:
            s=s.replace("const release = fs.readFileSync(path.join(siteRoot,'v40-release.js'),'utf8');", "const release = fs.readFileSync(path.join(siteRoot,'v40-release.js'),'utf8');\nconst readOwner = fs.readFileSync(path.join(siteRoot,'paper-import-management.js'),'utf8');")
          marker="assert.equal((release.match(/data-paper-import-management/g)||[]).length,1);"
          if 'A1 must remain before A2 inside paper-import-management.js' not in s:
            s=s.replace(marker,marker+"\nassert.ok(readOwner.indexOf('/* V5.1A — Paper Profile Validator.') < readOwner.indexOf('/* V5.1A2 — Bulk Question Image Upload.'),\n  'A1 must remain before A2 inside paper-import-management.js');")
          p.write_text(s)

          files={
            'verify-v5.1b2a-bulk-status-loader.cjs':'''const fs=require('fs');
const path=require('path');
const assert=require('assert');
const site=path.join(__dirname,'..');
const loader=fs.readFileSync(path.join(site,'v40-release.js'),'utf8');
const owner=fs.readFileSync(path.join(site,'question-bank-selection-qa.js'),'utf8');
const token="loadScriptOnce('question-bank-selection-qa.js', 'data-question-bank-selection-qa')";
assert.strictEqual(loader.split(token).length-1,1,'B1/B2A owner must load exactly once');
assert(owner.indexOf('/* V5.1B1 — Question Bank QA & completeness indicators.')<owner.indexOf('/* V5.1B2A — Safe bulk activate/deactivate for Question Bank.'),'B1 must remain before B2A internally');
assert(loader.indexOf('v52b1-question-bank-observer-gate.js')<loader.indexOf(token),'B1/B2A owner must remain after V52B1');
assert(loader.indexOf(token)<loader.indexOf('v52-topical-activation-guard.js'),'B1/B2A owner must remain before V52 activation guard');
console.log('V5.1B2A consolidated loader check passed.');
''',
            'verify-v5.1b2c-question-review-loader.cjs':'''const fs=require('fs');
const path=require('path');
const assert=require('assert');
const site=path.join(__dirname,'..');
const loader=fs.readFileSync(path.join(site,'v40-release.js'),'utf8');
const owner=fs.readFileSync(path.join(site,'question-bank-metadata-review.js'),'utf8');
const token="loadScriptOnce('question-bank-metadata-review.js', 'data-question-bank-metadata-review')";
assert.strictEqual(loader.split(token).length-1,1,'B2B/B2C owner must load exactly once');
assert(owner.indexOf('/* V5.1B2B — Safe bulk metadata editing for Question Bank.')<owner.indexOf('/* V5.1B2C — Persistent Question Bank review workflow.'),'B2B must remain before B2C internally');
assert(loader.indexOf('v52-topical-activation-guard.js')<loader.indexOf(token),'B2B/B2C owner must remain after V52 activation guard');
assert(loader.indexOf(token)<loader.indexOf('v52-teacher-topical-library.js'),'B2B/B2C owner must remain before V52 teacher topical library');
console.log('V5.1B2C consolidated loader check passed.');
''',
            'verify-v5.1b2e-multipart-question-management-loader.cjs':'''const fs=require('fs');
const path=require('path');
const assert=require('assert');
const site=path.join(__dirname,'..');
const loader=fs.readFileSync(path.join(site,'v40-release.js'),'utf8');
const owner=fs.readFileSync(path.join(site,'question-bank-audit-multipart.js'),'utf8');
const token="loadScriptOnce('question-bank-audit-multipart.js', 'data-question-bank-audit-multipart')";
assert.strictEqual(loader.split(token).length-1,1,'B2D/B2E owner must load exactly once');
assert(owner.indexOf('/* V5.1B2D — Teacher-only correction audit history viewer.')<owner.indexOf('/* V5.1B2E — Multipart Question Management.'),'B2D must remain before B2E internally');
assert(loader.indexOf('v52-teacher-topical-library.js')<loader.indexOf(token),'B2D/B2E owner must remain after V52 teacher topical library');
assert(loader.indexOf(token)<loader.indexOf('v51-exam-publication-safety.js'),'B2D/B2E owner must remain before standalone B3 safety');
console.log('V5.1B2E consolidated loader check passed.');
''',
            'verify-v5.1c2-student-exam-resume-progress-loader.cjs':'''const fs=require('fs');
const path=require('path');
const assert=require('assert');
const site=path.join(__dirname,'..');
const loader=fs.readFileSync(path.join(site,'v40-release.js'),'utf8');
const owner=fs.readFileSync(path.join(site,'student-exam-ui.js'),'utf8');
const token="loadScriptOnce('student-exam-ui.js', 'data-student-exam-ui')";
assert.strictEqual(loader.split(token).length-1,1,'C1/C2 owner must load exactly once');
assert(owner.indexOf('/* V5.1C1 — Student Exam Paper Library.')<owner.indexOf('/* V5.1C2 — Student Exam Resume & Progress Clarity.'),'C1 must remain before C2 internally');
assert(loader.indexOf('v51-exam-publication-ui-polish.js')<loader.indexOf(token),'student Exam owner must remain after standalone B3 UI polish');
assert(loader.indexOf(token)<loader.indexOf('v50-security-hardening.js'),'student Exam owner must remain before V50 security hardening');
console.log('V5.1C2 consolidated loader check passed.');
'''
          }
          for name,content in files.items(): (tests/name).write_text(content)

          p=tests/'verify-v5.1-stable-release.cjs'
          s=p.read_text()
          s=s.replace("assert.match(release,/student-exam-ui\\.js\\?v=51c1-1/);\nassert.match(release,/student-exam-ui\\.js\\?v=51c2-1/);",
                      "assert.match(release,/loadScriptOnce\\('student-exam-ui\\.js', 'data-student-exam-ui'\\)/);\nconst studentExamOwner=read('student-exam-ui.js');\nassert(studentExamOwner.indexOf('/* V5.1C1 — Student Exam Paper Library.')<studentExamOwner.indexOf('/* V5.1C2 — Student Exam Resume & Progress Clarity.'));" )
          p.write_text(s)
          PY
      - name: Commit loader verifier repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/tests
          git commit -m "Phase 4 V51: retarget loader verifiers to consolidated owners"
          git push origin HEAD:tech-debt-phase-4-v51-question-bank-management-checkpoint-1
